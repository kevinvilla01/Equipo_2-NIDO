<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — NIDO</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/tortuga_logo.png">
  <link rel="stylesheet" href="/css/ui.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/config.js"></script>
  <script src="/vendor/supabase.js"></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body class="tema-oscuro pantalla-login">

  <main class="login">
    <div class="login__marca">
      <img src="/icons/tortuga_logo.png" alt="" width="39" height="24">
      <h1 class="mb-0">NIDO</h1>
      <p class="tenue pequeno mb-0">Monitoreo y Conservación de Tortugas</p>
    </div>

    <form id="form-login" novalidate>
      <div class="campo" id="campo-usuario">
        <label class="campo__etiqueta" for="usuario">Usuario</label>
        <input class="campo__control" id="usuario" name="usuario" type="email"
               autocomplete="username" placeholder="nombre@tortugas.org" required>
      </div>

      <div class="campo" id="campo-contrasena">
        <label class="campo__etiqueta" for="contrasena">Contraseña</label>
        <input class="campo__control" id="contrasena" name="contrasena" type="password"
               autocomplete="current-password" required>
        <span class="campo__error oculto" id="error-login"></span>
      </div>

      <button class="btn btn--bloque" type="submit" id="btn-entrar">Entrar</button>
    </form>

    <div class="aviso aviso--aviso mt-5 mb-0 oculto" id="aviso-offline">
      <span><strong>Sin conexión.</strong>
        Necesitas señal para iniciar sesión.</span>
    </div>
  </main>

  <script type="module">
    import { supabase } from '/js/supabase.js';

    const avisoOffline = document.getElementById('aviso-offline');

    function actualizarEstadoConexion() {
      avisoOffline.classList.toggle('oculto', navigator.onLine);
    }

    window.addEventListener('online', actualizarEstadoConexion);
    window.addEventListener('offline', actualizarEstadoConexion);
    actualizarEstadoConexion();

    const form = document.getElementById('form-login');
    const campoContrasena = document.getElementById('campo-contrasena');
    const errorLogin = document.getElementById('error-login');
    const btnEntrar = document.getElementById('btn-entrar');

    function mostrarError(mensaje) {
      campoContrasena.classList.add('campo--error');
      errorLogin.textContent = mensaje;
      errorLogin.classList.remove('oculto');
    }

    function limpiarError() {
      campoContrasena.classList.remove('campo--error');
      errorLogin.classList.add('oculto');
    }

    function pantallaSegunRol(rol) {
      return rol === 'voluntario' ? '/patrullajes.html' : '/patrullajes.html';
    }

    form.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      limpiarError();

      const correo = document.getElementById('usuario').value.trim();
      const contrasena = document.getElementById('contrasena').value;

      btnEntrar.disabled = true;
      btnEntrar.textContent = 'Entrando…';

      const { data, error } = await supabase
        .from('usuarios')
        .select('id, nombre, correo, rol')
        .eq('correo', correo)
        .eq('password', contrasena)
        .maybeSingle();

      btnEntrar.disabled = false;
      btnEntrar.textContent = 'Entrar';

      if (error) {
        mostrarError('No se pudo conectar. Revisa tu conexión e intenta de nuevo.');
        return;
      }

      if (!data) {
        mostrarError('Correo o contraseña incorrectos.');
        return;
      }

      localStorage.setItem('nido_usuario', JSON.stringify(data));

      window.location.href = pantallaSegunRol(data.rol);
    });
  </script>
</body>
</html>

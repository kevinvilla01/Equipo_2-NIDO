<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Nuevo nido — NIDO</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <script src="/config.js"></script>
  <style>
    :root {
      --fondo: #111111; --superficie: #1c1c1c; --borde: #333333;
      --texto: #f5f5f5; --tenue: #a3a3a3;
      --exito: #4ade80; --aviso: #fbbf24; --error: #f87171; --marca: #0d9488;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0 16px 32px; font-family: system-ui, sans-serif; background: var(--fondo); color: var(--texto); }
    .barra { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 16px 0; border-bottom: 1px solid var(--borde); }
    .barra h1 { margin: 0; font-size: 1.25rem; }
    .barra a { color: var(--texto); text-decoration: none; font-size: 1.5rem; min-width: 44px; }
    .conexion { font-size: .875rem; font-weight: 600; color: var(--exito); white-space: nowrap; }
    .conexion--sin-senal { color: var(--aviso); }
    main { max-width: 480px; margin: 0 auto; }
    .campo { display: flex; flex-direction: column; gap: 6px; margin-top: 20px; }
    .campo label { font-weight: 600; }
    .requerido { color: var(--error); }
    .campo select, .campo input {
      min-height: 48px; padding: 0 12px; font: inherit; font-size: 1rem;
      background: var(--superficie); color: var(--texto);
      border: 1px solid var(--borde); border-radius: 8px;
    }
    .campo--error select, .campo--error input { border-color: var(--error); }
    .ayuda { font-size: .8125rem; color: var(--tenue); }
    .error { font-size: .8125rem; color: var(--error); }
    .oculto { display: none; }
    button {
      width: 100%; min-height: 52px; margin-top: 24px; font: inherit; font-weight: 700; font-size: 1rem;
      background: var(--marca); color: #fff; border: 0; border-radius: 8px; cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .aviso { margin-top: 16px; padding: 12px; border-radius: 8px; background: var(--superficie); border: 1px solid var(--borde); font-size: .9375rem; }
    .aviso--exito { border-color: var(--exito); }
    .aviso--error { border-color: var(--error); }
    h2 { margin: 32px 0 8px; font-size: 1.0625rem; }
    .contador { color: var(--aviso); font-weight: 600; }
    .lista { list-style: none; margin: 0; padding: 0; }
    .nido { padding: 12px 0; border-bottom: 1px solid var(--borde); }
    .nido__fila { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .nido__titulo { font-weight: 600; }
    .nido__detalle { font-size: .875rem; color: var(--tenue); margin-top: 4px; overflow-wrap: anywhere; }
    .badge { flex: none; padding: 2px 10px; border-radius: 999px; font-size: .75rem; font-weight: 700; }
    .badge--pendiente { background: rgba(251, 191, 36, .15); color: var(--aviso); }
    .badge--enviado { background: rgba(74, 222, 128, .15); color: var(--exito); }
  </style>
</head>
<body>
  <main>
    <header class="barra">
      <a href="/" aria-label="Volver">‹</a>
      <h1>Nuevo nido</h1>
      <span class="conexion" id="conexion">En línea</span>
    </header>

    <form id="form-nido" novalidate>
      <div class="campo" id="campo-tramo">
        <label for="tramo">Tramo <span class="requerido">*</span></label>
        <select id="tramo" name="tramo_id" required>
          <option value="">Selecciona un tramo</option>
        </select>
        <span class="error oculto">Selecciona el tramo.</span>
      </div>

      <div class="campo" id="campo-especie">
        <label for="especie">Especie <span class="requerido">*</span></label>
        <select id="especie" name="especie_id" required>
          <option value="">Selecciona una especie</option>
        </select>
        <span class="error oculto">Selecciona la especie.</span>
      </div>

      <div class="campo" id="campo-referencia">
        <label for="referencia">Referencia de ubicación <span class="requerido">*</span></label>
        <input id="referencia" name="referencia_ubicacion" type="text" autocomplete="off" required
               placeholder="Ej. 20 m al norte de la caseta 3">
        <span class="ayuda">Describe cómo encontrar el nido en la playa.</span>
        <span class="error oculto">Escribe la referencia de ubicación.</span>
      </div>

      <button type="submit" id="btn-guardar">Guardar nido</button>
    </form>

    <div class="aviso oculto" id="aviso" role="status"></div>

    <h2>Nidos en este teléfono <span class="contador" id="contador"></span></h2>
    <ul class="lista" id="lista-nidos"></ul>
    <p class="ayuda" id="lista-vacia">Aún no hay nidos registrados en este teléfono.</p>
  </main>

  <script type="module">
    import { guardarNido, listarNidos } from '/js/db.js';
    import { cargarCatalogo, CAMPO_NOMBRE } from '/js/catalogos.js';
    import { generarUUID } from '/js/uuid.js';

    const aviso = document.getElementById('aviso');
    const conexion = document.getElementById('conexion');
    const selectTramo = document.getElementById('tramo');
    const selectEspecie = document.getElementById('especie');
    const inputReferencia = document.getElementById('referencia');
    const nombres = { tramos: new Map(), especies: new Map() };

    function mostrarAviso(texto, tipo) {
      aviso.textContent = texto;
      aviso.className = `aviso aviso--${tipo}`;
    }

    function actualizarConexion() {
      conexion.textContent = navigator.onLine ? 'En línea' : 'Sin señal';
      conexion.classList.toggle('conexion--sin-senal', !navigator.onLine);
    }

    async function llenarSelect(select, tabla) {
      const registros = await cargarCatalogo(tabla);
      const nombreDe = (registro) => String(registro[CAMPO_NOMBRE[tabla]]);
      registros
        .slice()
        .sort((a, b) => nombreDe(a).localeCompare(nombreDe(b), 'es'))
        .forEach((registro) => {
          nombres[tabla].set(registro.id, nombreDe(registro));
          select.add(new Option(nombreDe(registro), registro.id));
        });
      return registros.length;
    }

    function validarCampo(idCampo, valido) {
      const campo = document.getElementById(idCampo);
      campo.classList.toggle('campo--error', !valido);
      campo.querySelector('.error').classList.toggle('oculto', valido);
      return valido;
    }

    function validar() {
      const tramoOk = validarCampo('campo-tramo', selectTramo.value !== '');
      const especieOk = validarCampo('campo-especie', selectEspecie.value !== '');
      const referenciaOk = validarCampo('campo-referencia', inputReferencia.value.trim() !== '');
      return tramoOk && especieOk && referenciaOk;
    }

    async function pintarLista() {
      const nidos = (await listarNidos()).sort((a, b) => b.creado_en.localeCompare(a.creado_en));
      const lista = document.getElementById('lista-nidos');
      lista.replaceChildren(...nidos.map((nido) => {
        const item = document.createElement('li');
        item.className = 'nido';
        const fila = document.createElement('div');
        fila.className = 'nido__fila';
        const titulo = document.createElement('span');
        titulo.className = 'nido__titulo';
        titulo.textContent = nombres.especies.get(nido.especie_id) ?? 'Especie';
        const badge = document.createElement('span');
        badge.className = nido.pendiente_envio ? 'badge badge--pendiente' : 'badge badge--enviado';
        badge.textContent = nido.pendiente_envio ? 'Pendiente de envío' : 'Enviado';
        fila.append(titulo, badge);
        const detalle = document.createElement('div');
        detalle.className = 'nido__detalle';
        const tramo = nombres.tramos.get(nido.tramo_id) ?? 'Tramo';
        const hora = new Date(nido.creado_en).toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' });
        detalle.textContent = `${tramo} · ${nido.referencia_ubicacion} · ${hora}`;
        item.append(fila, detalle);
        return item;
      }));
      const pendientes = nidos.filter((nido) => nido.pendiente_envio).length;
      document.getElementById('contador').textContent = pendientes ? `(${pendientes} ${pendientes === 1 ? 'pendiente' : 'pendientes'})` : '';
      document.getElementById('lista-vacia').classList.toggle('oculto', nidos.length > 0);
    }

    document.getElementById('form-nido').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      // Sin tramo, especie y referencia no se escribe nada, ni local ni remoto.
      if (!validar()) return;

      const ahora = new Date();
      // Mismas columnas que la tabla nidos; el id lo asigna Supabase.
      // TODO(HU-16): al sincronizar, upsert con onConflict 'clave' y mandar pendiente_envio: false,
      // porque el default del servidor es true.
      const nido = {
        clave: generarUUID(),
        tramo_id: Number(selectTramo.value),
        especie_id: Number(selectEspecie.value),
        referencia_ubicacion: inputReferencia.value.trim(),
        // Fecha local: con toISOString() después de las 18:00 en México saldría el día siguiente.
        fecha_hallazgo: ahora.toLocaleDateString('en-CA'),
        estado: 'registrado',
        pendiente_envio: true,
        // Hora del hallazgo, no de la sincronización.
        creado_en: ahora.toISOString(),
        patrullaje_id: null,
      };

      const boton = document.getElementById('btn-guardar');
      boton.disabled = true;
      try {
        await guardarNido(nido);
        evento.target.reset();
        mostrarAviso('Nido guardado en el teléfono. Queda pendiente de envío.', 'exito');
        await pintarLista();
      } catch (err) {
        console.error('No se pudo guardar el nido:', err);
        mostrarAviso('No se pudo guardar el nido en el teléfono. Intenta de nuevo.', 'error');
      } finally {
        boton.disabled = false;
      }
    });

    window.addEventListener('online', actualizarConexion);
    window.addEventListener('offline', actualizarConexion);
    actualizarConexion();

    const [totalTramos, totalEspecies] = await Promise.all([
      llenarSelect(selectTramo, 'tramos'),
      llenarSelect(selectEspecie, 'especies'),
    ]);
    if (totalTramos === 0 || totalEspecies === 0) {
      mostrarAviso('No hay tramos o especies en este teléfono. Abre esta pantalla una vez con señal para descargarlos.', 'error');
    }
    await pintarLista();
  </script>
</body>
</html>

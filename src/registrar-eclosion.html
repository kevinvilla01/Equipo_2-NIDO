<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar eclosión — NIDO</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/tortuga_logo.png">
  <link rel="stylesheet" href="/css/ui.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/config.js"></script>
  <script src="/vendor/supabase.js"></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body class="tema-oscuro app pantalla-formulario con-nav-inferior">

  <header class="barra">
    <a class="btn btn--fantasma barra__volver" href="/nuevo-nido.html" aria-label="Volver">
      <span aria-hidden="true">‹</span>
    </a>
    <h1 class="barra__titulo">Registrar eclosión</h1>
    <div class="barra__acciones">
      <span class="estado-sync" id="estado-sync">
        <span aria-hidden="true" id="estado-sync-icono">✓</span>
        <span id="estado-sync-texto">En línea</span>
      </span>
    </div>
  </header>

  <div class="franja-offline" role="status">Sin conexión. La eclosión se guarda en el teléfono y se envía al volver la señal.</div>

  <div class="contenedor">
    <main class="contenido-formulario">
      <div class="aviso oculto mb-5" id="aviso" role="alert"></div>

      <section class="tarjeta mb-5" aria-label="Datos del nido">
        <dl class="datos">
          <dt>Especie</dt><dd id="d-especie">—</dd>
          <dt>Tramo</dt><dd id="d-tramo">—</dd>
          <dt>Corral</dt><dd id="d-corral">—</dd>
          <dt>Huevos registrados</dt><dd><strong id="d-huevos">—</strong></dd>
          <dt>Reubicación</dt><dd id="d-reubicacion">—</dd>
          <dt>Eclosión estimada</dt><dd id="d-estimada">—</dd>
          <dt>Estado</dt><dd id="d-estado">—</dd>
        </dl>
      </section>

      <form id="form-eclosion" novalidate>
        <div class="campo" id="campo-vivas">
          <label class="campo__etiqueta" for="vivas">Crías vivas <span class="requerido">*</span></label>
          <input class="campo__control" id="vivas" name="vivas" type="number" inputmode="numeric"
                 min="0" step="1" required placeholder="Ej. 72">
          <span class="campo__error oculto" data-error="vivas"></span>
        </div>

        <div class="campo" id="campo-muertas">
          <label class="campo__etiqueta" for="muertas">Crías muertas <span class="requerido">*</span></label>
          <input class="campo__control" id="muertas" name="muertas" type="number" inputmode="numeric"
                 min="0" step="1" required placeholder="Ej. 8">
          <span class="campo__ayuda" id="ayuda-suma">Vivas más muertas no pueden pasar de los huevos registrados.</span>
          <span class="campo__error oculto" data-error="muertas"></span>
        </div>

        <div class="campo" id="campo-fecha">
          <label class="campo__etiqueta" for="fecha">Fecha de eclosión <span class="requerido">*</span></label>
          <input class="campo__control" id="fecha" name="fecha" type="date" required>
          <span class="campo__error oculto" data-error="fecha"></span>
        </div>

        <button class="btn btn--bloque mt-5" type="submit" id="btn-guardar">Registrar eclosión</button>
      </form>
    </main>
  </div>

  <nav class="nav-inferior" data-activa="nidos"></nav>

  <script type="module">
    import { obtenerNido, actualizarNido } from '/js/db.js';
    import { cargarCatalogo, CAMPO_NOMBRE } from '/js/catalogos.js';
    import { avisarPendientes, enviarPendientes } from '/js/envio-pendientes.js';
    import { ESTADOS, ETIQUETA_ESTADO, validarPasoAEclosionado } from '/js/estados-nido.js';

    const aviso = document.getElementById('aviso');
    const form = document.getElementById('form-eclosion');
    const boton = document.getElementById('btn-guardar');
    const inputVivas = document.getElementById('vivas');
    const inputMuertas = document.getElementById('muertas');
    const inputFecha = document.getElementById('fecha');
    const parametrosUrl = new URLSearchParams(window.location.search);
    const clave = parametrosUrl.get('clave');
    // Se vuelve a la lista desde la que se entró (HU-13: nidos activos).
    const DESTINO = parametrosUrl.get('desde') === 'activos' ? '/nidos-activos.html' : '/nuevo-nido.html';
    document.querySelector('.barra__volver').href = DESTINO;
    // Fecha local: con toISOString() después de las 18:00 en México saldría el día siguiente.
    const hoy = new Date().toLocaleDateString('en-CA');
    inputFecha.value = hoy;
    inputFecha.max = hoy;

    function mostrarAviso(texto, tipo = 'error') {
      aviso.textContent = texto;
      aviso.className = `aviso aviso--${tipo} mb-5`;
    }

    function ocultarAviso() {
      aviso.className = 'aviso oculto mb-5';
    }

    // 'YYYY-MM-DD' → 'DD/MM/AAAA' sin pasar por Date (evita el desfase de zona horaria).
    function formatearFecha(fecha) {
      if (!fecha) return '—';
      const [anio, mes, dia] = fecha.split('-');
      return `${dia}/${mes}/${anio}`;
    }

    function bloquearFormulario() {
      form.querySelectorAll('input, button').forEach((control) => { control.disabled = true; });
    }

    function pintarErrores(errores) {
      for (const campo of ['vivas', 'muertas', 'fecha']) {
        // La suma excedida marca los dos campos de crías.
        const marcado = Boolean(errores[campo]) || (errores.suma && campo !== 'fecha');
        document.getElementById(`campo-${campo}`).classList.toggle('campo--error', marcado);
        const error = form.querySelector(`[data-error="${campo}"]`);
        error.textContent = errores[campo] ?? '';
        error.classList.toggle('oculto', !errores[campo]);
      }
      if (errores.suma) mostrarAviso(errores.suma);
    }

    // La fecha: obligatoria, no futura y no anterior a la reubicación (como el servidor).
    function validarFecha(nido) {
      const fecha = inputFecha.value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) return 'Elige la fecha de eclosión.';
      if (fecha > hoy) return 'La fecha de eclosión no puede estar en el futuro.';
      if (nido.fecha_reubicacion && fecha < nido.fecha_reubicacion) {
        return `La fecha no puede ser anterior a la reubicación (${formatearFecha(nido.fecha_reubicacion)}).`;
      }
      return null;
    }

    async function cargar() {
      if (!clave) {
        mostrarAviso('No se indicó el nido. Vuelve a la lista y elige uno.');
        bloquearFormulario();
        return null;
      }

      const [nido, especies, tramos] = await Promise.all([
        obtenerNido(clave),
        cargarCatalogo('especies'),
        cargarCatalogo('tramos'),
      ]);
      if (!nido) {
        mostrarAviso('Este nido no está guardado en el teléfono.');
        bloquearFormulario();
        return null;
      }

      const especie = especies.find((registro) => registro.id === nido.especie_id);
      const tramo = tramos.find((registro) => registro.id === nido.tramo_id);
      document.getElementById('d-especie').textContent = especie?.[CAMPO_NOMBRE.especies] ?? 'Especie';
      document.getElementById('d-tramo').textContent = tramo?.[CAMPO_NOMBRE.tramos] ?? 'Tramo';
      document.getElementById('d-corral').textContent = nido.corral ?? '—';
      document.getElementById('d-huevos').textContent = nido.huevos_contados ?? '—';
      document.getElementById('d-reubicacion').textContent = formatearFecha(nido.fecha_reubicacion);
      document.getElementById('d-estimada').textContent = formatearFecha(nido.fecha_estimada_eclosion);
      document.getElementById('d-estado').textContent = ETIQUETA_ESTADO[nido.estado] ?? nido.estado;
      if (nido.fecha_reubicacion) inputFecha.min = nido.fecha_reubicacion;
      if (Number.isInteger(nido.huevos_contados)) {
        document.getElementById('ayuda-suma').textContent =
          `Vivas más muertas no pueden pasar de ${nido.huevos_contados} huevos.`;
      }

      const { errores } = validarPasoAEclosionado(nido, { vivas: 0, muertas: 0 });
      if (errores?.estado) {
        mostrarAviso(errores.estado, 'aviso');
        bloquearFormulario();
        return null;
      }
      return nido;
    }

    const nidoInicial = await cargar();

    form.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      if (!nidoInicial) return;
      ocultarAviso();

      // Se relee el nido por si cambió en otra pestaña desde que se abrió la pantalla.
      const nido = await obtenerNido(clave);
      const resultado = validarPasoAEclosionado(nido, { vivas: inputVivas.value, muertas: inputMuertas.value });
      const errorFecha = nido ? validarFecha(nido) : null;
      if (!resultado.valido || errorFecha) {
        const errores = { ...(resultado.errores ?? {}), ...(errorFecha ? { fecha: errorFecha } : {}) };
        if (errores.estado) {
          mostrarAviso(errores.estado, 'aviso');
          bloquearFormulario();
          return;
        }
        // No se guarda nada: ni local ni remoto.
        pintarErrores(errores);
        return;
      }
      pintarErrores({});

      // Mismas columnas que la tabla nidos. crias_por_liberar es la de la vista nidos_activos
      // (HU-13): sin ella la liberación sin señal no ofrecería este nido.
      const eclosionado = {
        ...nido,
        estado: ESTADOS.ECLOSIONADO,
        crias_vivas: resultado.datos.vivas,
        crias_muertas: resultado.datos.muertas,
        fecha_eclosion: inputFecha.value,
        crias_por_liberar: resultado.datos.vivas,
        pendiente_envio: true,
        conflicto: null,
      };

      boton.disabled = true;
      try {
        await actualizarNido(eclosionado);
      } catch (err) {
        console.error('No se pudo guardar la eclosión:', err);
        mostrarAviso('No se pudo guardar la eclosión en el teléfono. Intenta de nuevo.');
        boton.disabled = false;
        return;
      }
      await avisarPendientes().catch(() => {});
      // Con señal se intenta enviar ya (máx. 5 s); si no, queda en "Enviar pendientes".
      // Reenviar es seguro: registrar_eclosion es idempotente.
      if (navigator.onLine) {
        await Promise.race([
          enviarPendientes().catch(() => {}),
          new Promise((resolve) => setTimeout(resolve, 5000)),
        ]);
      }
      window.location.href = `${DESTINO}?aviso=eclosionado`;
    });
  </script>
</body>
</html>

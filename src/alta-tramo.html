<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuevo tramo — NIDO</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/tortuga_logo.png">
  <link rel="stylesheet" href="/css/ui.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/config.js"></script>
  <script src="/vendor/supabase.js"></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body class="tema-oscuro app pantalla-formulario">

  <header class="barra">
    <a class="btn btn--fantasma barra__volver" href="/catalogos.html" aria-label="Volver">
      <span aria-hidden="true">‹</span>
    </a>
    <h1 class="barra__titulo" id="titulo-pantalla">Nuevo tramo</h1>
    <div class="barra__acciones">
      <span class="estado-sync" id="estado-sync">
        <span aria-hidden="true" id="estado-sync-icono">✓</span>
        <span id="estado-sync-texto">Sincronizado</span>
      </span>
    </div>
  </header>

  <div class="franja-offline" role="status">Sin conexión. Los datos se cargan al volver la señal.</div>

  <div class="contenedor">
    <main class="contenido-formulario">
      <form id="form-tramo">
        <div class="aviso aviso--error oculto" id="aviso-formulario" role="alert"></div>

        <div class="campo">
          <label class="campo__etiqueta" for="nombre-tramo">
            Nombre del tramo <span class="requerido">*</span>
          </label>
          <input class="campo__control" id="nombre-tramo" name="nombre" type="text" required>
          <span class="campo__ayuda">Debe ser único en el campamento</span>
          <span class="campo__error oculto" id="error-nombre-tramo"></span>
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="km-inicial">
            Kilómetro inicial <span class="requerido">*</span>
          </label>
          <input class="campo__control" id="km-inicial" name="km_inicial" type="number"
                 step="0.1" min="0" inputmode="decimal" required>
          <span class="campo__ayuda">Ubicación de inicio del recorrido</span>
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="km-final">
            Kilómetro final <span class="requerido">*</span>
          </label>
          <input class="campo__control" id="km-final" name="km_final" type="number"
                 step="0.1" min="0" inputmode="decimal" required>
          <span class="campo__ayuda">Punto de finalización</span>
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="referencia">
            Referencia <span class="requerido">*</span>
          </label>
          <input class="campo__control" id="referencia" name="referencia" type="text" required>
          <span class="campo__ayuda">Punto de referencia para ubicar el tramo</span>
        </div>

        <div class="pila mt-4">
          <button class="btn btn--bloque" type="submit" id="btn-guardar">Guardar</button>
          <button class="btn btn--peligro btn--bloque oculto" type="button" id="btn-eliminar">Eliminar tramo</button>
          <a class="btn btn--fantasma btn--bloque" href="/catalogos.html">Cancelar</a>
        </div>
      </form>
    </main>
  </div>

  <dialog class="dialogo" id="dialogo-eliminar">
    <div class="dialogo__cuerpo">
      <h3 class="dialogo__titulo" id="dialogo-titulo">¿Eliminar este tramo?</h3>
      <p class="dialogo__texto">Esta acción no se puede deshacer.</p>
      <div class="dialogo__pie">
        <button class="btn btn--secundario" type="button" id="btn-dialogo-volver">Volver</button>
        <button class="btn btn--peligro" type="button" id="btn-dialogo-confirmar">Sí, eliminar</button>
      </div>
    </div>
  </dialog>

  <script type="module">
    import { supabase } from '/js/supabase.js';


    const form = document.getElementById('form-tramo');
    const inputNombre = document.getElementById('nombre-tramo');
    const inputKmInicial = document.getElementById('km-inicial');
    const inputKmFinal = document.getElementById('km-final');
    const inputReferencia = document.getElementById('referencia');
    const campoNombre = inputNombre.closest('.campo');
    const errorNombre = document.getElementById('error-nombre-tramo');
    const avisoFormulario = document.getElementById('aviso-formulario');
    const btnGuardar = document.getElementById('btn-guardar');
    const btnEliminar = document.getElementById('btn-eliminar');
    const dialogo = document.getElementById('dialogo-eliminar');
    const btnDialogoVolver = document.getElementById('btn-dialogo-volver');
    const btnDialogoConfirmar = document.getElementById('btn-dialogo-confirmar');

    function mostrarErrorNombre(mensaje) {
      campoNombre.classList.add('campo--error');
      errorNombre.textContent = mensaje;
      errorNombre.classList.remove('oculto');
    }

    function limpiarErrorNombre() {
      campoNombre.classList.remove('campo--error');
      errorNombre.classList.add('oculto');
    }

    function mostrarAviso(mensaje) {
      avisoFormulario.textContent = mensaje;
      avisoFormulario.classList.remove('oculto');
    }

    function limpiarAviso() {
      avisoFormulario.classList.add('oculto');
    }

    function bloquearFormulario(bloqueado) {
      form.querySelectorAll('input, button').forEach((el) => { el.disabled = bloqueado; });
    }

    const idParam = new URLSearchParams(window.location.search).get('id');
    const editando = idParam !== null;
    const idValido = editando && /^\d+$/.test(idParam);
    const idTramo = idValido ? Number(idParam) : null;
    let nombreCargado = '';

    async function cargarTramo() {
      bloquearFormulario(true);

      const { data, error } = await supabase
        .from('tramos')
        .select('nombre, kilometro_inicial, kilometro_final, referencia')
        .eq('id', idTramo)
        .maybeSingle();

      if (error) {
        console.error('Error de Supabase al leer el tramo:', error);
        mostrarAviso('No se pudo cargar el tramo. Revisa tu conexión y vuelve a abrir esta pantalla.');
        return;
      }

      if (!data) {
        mostrarAviso('Este tramo ya no existe. Puede que alguien lo haya eliminado.');
        return;
      }

      nombreCargado = data.nombre;
      inputNombre.value = data.nombre ?? '';
      inputKmInicial.value = data.kilometro_inicial ?? '';
      inputKmFinal.value = data.kilometro_final ?? '';
      inputReferencia.value = data.referencia ?? '';
      bloquearFormulario(false);
    }

    if (editando) {
      document.title = 'Editar tramo — NIDO';
      document.getElementById('titulo-pantalla').textContent = 'Editar tramo';
      btnEliminar.classList.remove('oculto');

      if (idValido) {
        cargarTramo();
      } else {
        bloquearFormulario(true);
        mostrarAviso('El enlace no es válido: falta indicar qué tramo editar.');
      }
    }

    form.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      limpiarErrorNombre();
      limpiarAviso();

      const datos = {
        nombre: inputNombre.value.trim(),
        kilometro_inicial: inputKmInicial.value,
        kilometro_final: inputKmFinal.value,
        referencia: inputReferencia.value.trim()
      };

      btnGuardar.disabled = true;
      btnGuardar.textContent = 'Guardando…';

      let error = null;
      let sinFilas = false;

      if (editando) {
        const respuesta = await supabase
          .from('tramos')
          .update(datos)
          .eq('id', idTramo)
          .select('id');
        error = respuesta.error;
        sinFilas = !error && respuesta.data.length === 0;
      } else {
        const respuesta = await supabase
          .from('tramos')
          .insert({ ...datos, creado_en: new Date().toISOString() });
        error = respuesta.error;
      }

      btnGuardar.disabled = false;
      btnGuardar.textContent = 'Guardar';

      if (error) {
        if (error.code === '23505') {
          mostrarErrorNombre('Ya existe un tramo con ese nombre.');
        } else {
          console.error('Error de Supabase al guardar tramo:', error);
          mostrarAviso('No se pudo guardar. Revisa tu conexión e intenta de nuevo.');
        }
        return;
      }

      if (sinFilas) {
        mostrarAviso('No se guardaron los cambios: el tramo ya no existe o la base de datos no permite editarlo (falta la política de UPDATE).');
        return;
      }

      window.location.href = '/catalogos.html';
    });

    btnEliminar.addEventListener('click', () => {
      document.getElementById('dialogo-titulo').textContent =
        `¿Eliminar el tramo "${nombreCargado}"?`;
      dialogo.showModal();
    });

    btnDialogoVolver.addEventListener('click', () => dialogo.close());

    btnDialogoConfirmar.addEventListener('click', async () => {
      btnDialogoConfirmar.disabled = true;
      btnDialogoConfirmar.textContent = 'Eliminando…';

      const { data, error } = await supabase
        .from('tramos')
        .delete()
        .eq('id', idTramo)
        .select('id');

      btnDialogoConfirmar.disabled = false;
      btnDialogoConfirmar.textContent = 'Sí, eliminar';
      dialogo.close();

      if (error) {
        console.error('Error de Supabase al eliminar tramo:', error);
        mostrarAviso(error.code === '23503'
          ? 'No se puede eliminar este tramo porque tiene registros asociados.'
          : 'No se pudo eliminar. Revisa tu conexión e intenta de nuevo.');
        return;
      }

      if (data.length === 0) {
        mostrarAviso('No se eliminó: el tramo ya no existe o la base de datos no permite borrarlo (falta la política de DELETE).');
        return;
      }

      window.location.href = '/catalogos.html';
    });
  </script>
</body>
</html>

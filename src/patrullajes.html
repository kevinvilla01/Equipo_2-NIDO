<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patrullajes — NIDO</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/tortuga_logo.png">
  <link rel="stylesheet" href="/css/index_styles.css">
  <link rel="stylesheet" href="/css/ui.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/config.js"></script>
  <script src="/vendor/supabase.js"></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body class="tema-oscuro app con-nav-inferior pantalla-patrullajes">

  <header class="barra">
    <h1 class="barra__titulo">Patrullajes</h1>
    <div class="barra__acciones">
      <a class="btn btn--fantasma btn--pequeno oculto" href="/catalogos.html" data-solo-coordinador>Catálogos</a>
      <a class="btn btn--fantasma btn--pequeno oculto" href="/voluntarios.html" data-solo-coordinador>Voluntarios</a>
      <button class="btn btn--fantasma btn--pequeno" type="button" data-cerrar-sesion>Salir</button>
      <span class="estado-sync" id="estado-sync">
        <span aria-hidden="true" id="estado-sync-icono">✓</span>
        <span id="estado-sync-texto">En línea</span>
      </span>
    </div>
  </header>

  <div class="franja-offline" role="status">Sin conexión. Los patrullajes se cargan al volver la señal.</div>

  <div class="phone">
    <div class="content">
      <div class="filtros">
        <input type="search" id="buscar-tramo" placeholder="Buscar por tramo..." autocomplete="off">
        <input type="date" id="filtro-fecha">
        <button type="button" id="limpiar-filtros" class="btn-limpiar">Limpiar</button>
      </div>

      <main class="list">

        <div class="lista-titulo">
          <h3>Patrullajes creados</h3>
          <div class="lista-creados" id="patrol-list">
            <p class="state-msg">Cargando patrullajes...</p>
          </div>
        </div>

        <div class="lista-titulo">
            <h3>Patrullajes completados</h3>
        <div class="lista-completados" id="patrol-list-completed">

          <p class="state-msg">Cargando patrullajes...</p>
        </div>
        </div>
      </main>

    <div class="cta-wrap">
      <a href="registrar-patrulla.html" class="cta">Iniciar patrullaje</a>
    </div>
    </div>
  </div>

  <nav class="nav-inferior" data-activa="patrullaje"></nav>

  <script type="module" src="/js/patrullajes-lista.js"></script>
  <script type="module">
    // Pantalla de entrada tras el login: deja tramos y especies en IndexedDB
    // para poder registrar nidos sin señal.
    import { descargarCatalogos } from '/js/catalogos.js';
    descargarCatalogos();
  </script>
</body>
</html>

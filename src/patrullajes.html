<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patrullajes — NIDO</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/tortuga_logo.png">
  <link rel="stylesheet" href="/css/ui.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/config.js"></script>
  <script src="/vendor/supabase.js"></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body class="tema-oscuro app con-nav-inferior">

  <header class="barra">
    <h1 class="barra__titulo">Patrullajes</h1>
    <div class="barra__acciones">
      <a class="btn btn--fantasma btn--pequeno" href="/catalogos.html">Catálogos</a>
      <a class="btn btn--fantasma btn--pequeno" href="/voluntarios.html">Voluntarios</a>
      <span class="estado-sync" id="estado-sync">
        <span aria-hidden="true" id="estado-sync-icono">✓</span>
        <span id="estado-sync-texto">En línea</span>
      </span>
    </div>
  </header>

  <div class="franja-offline" role="status">Sin conexión. Los patrullajes se cargan al volver la señal.</div>

  <div class="contenedor">
    <div class="aviso aviso--exito oculto" id="aviso-resultado" role="status"></div>

    <div class="encabezado">
      <h2>Recientes</h2>
      <a class="btn" href="/registrar-patrulla.html">Iniciar patrullaje</a>
    </div>

    <main class="pila" id="patrol-list" aria-busy="true">
      <div class="esqueleto esqueleto--tarjeta" aria-hidden="true"></div>
      <div class="esqueleto esqueleto--tarjeta" aria-hidden="true"></div>
    </main>
  </div>

  <nav class="nav-inferior" data-activa="patrullaje"></nav>

  <script type="module" src="/js/patrullajes-lista.js"></script>
  <script type="module">
    // Pantalla de entrada tras el login: deja tramos y especies en IndexedDB
    // para poder registrar nidos sin señal.
    import { descargarCatalogos } from '/js/catalogos.js';
    descargarCatalogos();
  </script>
</body>
</html>

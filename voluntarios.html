<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voluntarios — NIDO</title>
  <link rel="stylesheet" href="estilos/ui.css">
  <link rel="icon" href="src/icons/tortuga_logo.png">
  <style>
    .pantalla-voluntarios .contenedor { display: flex; flex-direction: column; }

    .pantalla-voluntarios .barra {
      background: transparent; color: var(--color-texto);
      border-bottom: 1px solid var(--color-borde);
    }
    .pantalla-voluntarios .barra__volver {
      padding: 0; min-width: var(--alto-control);
    }
    .estado-sync {
      display: inline-flex; align-items: center; gap: var(--e-1);
      font-size: var(--t-sm); font-weight: 600; color: var(--color-exito);
      white-space: nowrap;
    }
    .estado-sync--sin-conexion { color: var(--color-aviso); }

    .sr-solo {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    .chips-filtro {
      display: flex; gap: var(--e-2); flex-wrap: wrap;
      padding: var(--e-4) 0;
    }
    .chip-filtro {
      min-height: var(--alto-control); padding: 0 var(--e-4);
      border-radius: 999px; border: 1px solid var(--color-borde-fuerte);
      background: var(--color-superficie); color: var(--color-texto-suave);
      font-weight: 600; font-size: var(--t-sm); cursor: pointer;
    }
    .chip-filtro[aria-pressed="true"] {
      background: var(--color-marca); border-color: var(--color-marca); color: #fff;
    }

    .switch { position: relative; display: inline-flex; align-items: center; flex: none; }
    .switch input {
      position: absolute; width: 44px; height: 44px;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      margin: 0; opacity: 0; cursor: pointer;
    }
    .switch__pista {
      display: inline-block; width: 44px; height: 26px; border-radius: 999px;
      background: var(--color-borde-fuerte); position: relative;
      transition: background .15s;
    }
    .switch__pista::after {
      content: ""; position: absolute; top: 3px; left: 3px;
      width: 20px; height: 20px; border-radius: 50%; background: #fff;
      transition: transform .15s;
    }
    .switch input:checked + .switch__pista { background: var(--color-marca); }
    .switch input:checked + .switch__pista::after { transform: translateX(18px); }
    .switch input:focus-visible + .switch__pista {
      outline: 2px solid var(--color-marca); outline-offset: 2px;
    }

    .fila-voluntario { align-items: flex-start; }
    .fila-voluntario__texto {
      display: flex; flex-direction: column; gap: var(--e-1); min-width: 0;
    }
    .fila-voluntario__texto .tarjeta__titulo { margin-bottom: 0; }

    .fila-voluntario__enlace {
      flex: 1; min-width: 0;
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: var(--e-3); color: inherit; text-decoration: none;
    }
    .fila-voluntario__chevron { color: var(--color-texto-tenue); flex: none; }
    .fila-voluntario__badges { display: flex; align-items: center; gap: var(--e-2); }

    .badge-rol {
      display: inline-flex; align-items: center; gap: var(--e-1);
      padding: 2px var(--e-2); border-radius: 999px;
      font-size: var(--t-xs); font-weight: 700;
    }
    .badge-rol::before { content: "●"; font-size: 8px; }
    .badge-rol--coordinador { background: var(--color-error-suave); color: var(--color-error); }
    .badge-rol--voluntario  { background: var(--color-info-suave);  color: var(--color-info); }
    .badge-rol--inactivo {
      background: var(--color-borde); color: var(--color-texto-tenue);
    }

    .panel-voluntarios { padding: var(--e-4) 0; flex: 1 1 auto; overflow-y: auto; }
    .pie-voluntarios {
      padding: var(--e-4); padding-bottom: calc(var(--e-4) + env(safe-area-inset-bottom));
      background: var(--color-fondo); border-top: 1px solid var(--color-borde);
    }

    .tema-oscuro .esqueleto {
      background: linear-gradient(90deg,
                  var(--color-borde) 25%, var(--color-borde-fuerte) 50%, var(--color-borde) 75%);
      background-size: 200% 100%;
    }
  </style>
</head>
<body class="tema-oscuro app pantalla-voluntarios">

  <header class="barra">
    <a class="btn btn--fantasma barra__volver" href="catalogos.html" aria-label="Volver">
      <span aria-hidden="true">‹</span>
    </a>
    <h1 class="barra__titulo">Voluntarios</h1>
    <div class="barra__acciones">
      <span class="estado-sync" id="estado-sync">
        <span aria-hidden="true" id="estado-sync-icono">✓</span>
        <span id="estado-sync-texto">Sincronizado</span>
      </span>
    </div>
  </header>

  <div class="contenedor">
    <div class="chips-filtro" role="group" aria-label="Filtrar voluntarios">
      <button class="chip-filtro" type="button" data-filtro="todos" aria-pressed="true">Todos</button>
      <button class="chip-filtro" type="button" data-filtro="activos" aria-pressed="false">Activos</button>
      <button class="chip-filtro" type="button" data-filtro="inactivos" aria-pressed="false">Inactivos</button>
    </div>

    <div class="panel-voluntarios">
      <div class="pila" id="lista-voluntarios"></div>
    </div>
    <div class="pie-voluntarios">
      <a class="btn btn--bloque" href="alta-voluntario.html">Nuevo voluntario</a>
    </div>
  </div>

  <script type="module">
    import { supabase } from './scripts/supabase.js';

    const estadoSync = document.getElementById('estado-sync');
    const estadoSyncIcono = document.getElementById('estado-sync-icono');
    const estadoSyncTexto = document.getElementById('estado-sync-texto');

    function actualizarEstadoSincronizacion() {
      const hayConexion = navigator.onLine;
      estadoSync.classList.toggle('estado-sync--sin-conexion', !hayConexion);
      estadoSyncTexto.textContent = hayConexion ? 'Sincronizado' : 'Sin conexión';
    }

    window.addEventListener('online', actualizarEstadoSincronizacion);
    window.addEventListener('offline', actualizarEstadoSincronizacion);
    actualizarEstadoSincronizacion();

    let datosVoluntarios = [];
    let datosCargados = false;
    let filtroActivo = 'todos';

    const listaVoluntarios = document.getElementById('lista-voluntarios');

    const avisoLista = document.createElement('div');
    avisoLista.className = 'aviso aviso--error oculto';
    avisoLista.setAttribute('role', 'alert');
    listaVoluntarios.parentElement.before(avisoLista);

    function escaparHTML(valor) {
      const div = document.createElement('div');
      div.textContent = valor;
      return div.innerHTML;
    }

    function mostrarAviso(mensaje) {
      avisoLista.textContent = mensaje;
      avisoLista.classList.remove('oculto');
    }

    function limpiarAviso() {
      avisoLista.classList.add('oculto');
    }

    function etiquetaRol(rol) {
      return rol === 'coordinador' ? 'Coordinador' : 'Voluntario';
    }

    function mostrarCargando() {
      listaVoluntarios.setAttribute('aria-busy', 'true');
      listaVoluntarios.innerHTML = `
        <div class="esqueleto esqueleto--tarjeta" aria-hidden="true"></div>
        <div class="esqueleto esqueleto--tarjeta" aria-hidden="true"></div>`;
    }

    function mostrarError() {
      listaVoluntarios.removeAttribute('aria-busy');
      listaVoluntarios.innerHTML = `
        <div class="estado-error">
          <p class="estado-error__titulo">No pudimos cargar los voluntarios</p>
          <p class="estado-error__texto">
            No se pudieron traer los datos. Revisa tu conexión; si el problema
            sigue, avisa al equipo.
          </p>
          <button class="btn btn--secundario" type="button">Reintentar</button>
        </div>`;
      listaVoluntarios.querySelector('button').addEventListener('click', cargarVoluntarios);
    }

    async function cargarVoluntarios() {
      datosCargados = false;
      limpiarAviso();
      mostrarCargando();

      const { data, error } = await supabase
        .from('usuarios')
        .select('id, nombre, correo, rol, activo')
        .order('creado_en', { ascending: false });

      if (error) {
        console.error('Error de Supabase al leer usuarios:', error);
        mostrarError();
        return;
      }

      datosVoluntarios = data.map((usuario) => ({
        id: usuario.id,
        nombre: usuario.nombre,
        correo: usuario.correo,
        rol: usuario.rol === 'voluntario' ? 'voluntario' : 'coordinador',
        activo: usuario.activo !== false
      }));

      datosCargados = true;
      renderizarVoluntarios();
    }

    async function cambiarActivo(voluntario, nuevoValor) {
      limpiarAviso();

      const { data, error } = await supabase
        .from('usuarios')
        .update({ activo: nuevoValor })
        .eq('id', voluntario.id)
        .select('id');

      if (error) {
        console.error('Error de Supabase al cambiar activo:', error);
        mostrarAviso('No se pudo cambiar el estado. Revisa tu conexión e intenta de nuevo.');
      } else if (data.length === 0) {
        mostrarAviso('No se guardó el cambio: la base de datos no permite editar usuarios (falta la política de UPDATE en la tabla usuarios).');
      } else {
        voluntario.activo = nuevoValor;
      }

      renderizarVoluntarios();
    }

    function renderizarVoluntarios() {
      if (!datosCargados) return;

      listaVoluntarios.removeAttribute('aria-busy');
      listaVoluntarios.innerHTML = '';

      const items = datosVoluntarios.filter((v) => {
        if (filtroActivo === 'activos') return v.activo;
        if (filtroActivo === 'inactivos') return !v.activo;
        return true;
      });

      if (items.length === 0) {
        const textoVacio = {
          todos: 'Todavía no hay voluntarios registrados.',
          activos: 'No hay voluntarios activos con este filtro.',
          inactivos: 'No hay voluntarios inactivos con este filtro.'
        }[filtroActivo];

        listaVoluntarios.innerHTML = `
          <div class="estado-vacio">
            <div class="estado-vacio__icono" aria-hidden="true"></div>
            <p class="estado-vacio__titulo">Sin resultados</p>
            <p class="estado-vacio__texto">${textoVacio}</p>
          </div>`;
        return;
      }

      items.forEach((item) => {
        const claseBadge = item.activo
          ? `badge-rol--${item.rol}`
          : 'badge-rol--inactivo';

        const fila = document.createElement('div');
        fila.className = 'tarjeta fila entre fila-voluntario';
        fila.innerHTML = `
          <a class="fila-voluntario__enlace" href="alta-voluntario.html?id=${encodeURIComponent(item.id)}">
            <div class="fila-voluntario__texto">
              <span class="tarjeta__titulo">${escaparHTML(item.nombre)}</span>
              <span class="fila-voluntario__badges">
                <span class="badge-rol ${claseBadge}">${etiquetaRol(item.rol)}</span>
              </span>
              <span class="tenue pequeno">${escaparHTML(item.correo)}</span>
            </div>
            <span class="fila-voluntario__chevron" aria-hidden="true">›</span>
          </a>
          <label class="switch">
            <input type="checkbox" data-id="${escaparHTML(item.id)}" ${item.activo ? 'checked' : ''}>
            <span class="switch__pista" aria-hidden="true"></span>
            <span class="sr-solo">${escaparHTML(item.nombre)}: ${item.activo ? 'activo' : 'inactivo'}</span>
          </label>`;
        listaVoluntarios.appendChild(fila);
      });

      listaVoluntarios.querySelectorAll('.switch input').forEach((input) => {
        input.addEventListener('change', (evento) => {
          const voluntario = datosVoluntarios.find(
            (v) => String(v.id) === evento.target.dataset.id
          );
          input.disabled = true;
          cambiarActivo(voluntario, evento.target.checked);
        });
      });
    }

    document.querySelectorAll('.chip-filtro').forEach((chip) => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip-filtro').forEach((otro) =>
          otro.setAttribute('aria-pressed', 'false'));
        chip.setAttribute('aria-pressed', 'true');
        filtroActivo = chip.dataset.filtro;
        renderizarVoluntarios();
      });
    });

    cargarVoluntarios();
  </script>
</body>
</html>

<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — NIDO</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body.pantalla-login {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--e-5);
    }
    .login { width: 100%; max-width: 380px; }
    .login__marca { text-align: center; margin-bottom: var(--e-6); }
  </style>
</head>
<body class="tema-oscuro pantalla-login">

  <main class="login">
    <div class="login__marca">
      <img src="img/tortuga_logo.png">
      <h1 class="mb-0">NIDO</h1>
      <p class="tenue pequeno mb-0">Monitoreo y Conservación de Tortugas</p>
    </div>

    <form>
      <div class="campo">
        <label class="campo__etiqueta" for="usuario">Usuario</label>
        <input class="campo__control" id="usuario" name="usuario" type="text"
               autocomplete="username" placeholder="guardaparques_playanorte">
      </div>

      <div class="campo">
        <label class="campo__etiqueta" for="contrasena">Contraseña</label>
        <input class="campo__control" id="contrasena" name="contrasena" type="password"
               autocomplete="current-password">
      </div>

      <button class="btn btn--bloque" type="submit">Entrar</button>
    </form>

    <div class="aviso aviso--aviso mt-5 mb-0 oculto" id="aviso-offline">
      <span><strong>Modo fuera de línea listo.</strong>
        Inicia sesión localmente usando tus credenciales.</span>
    </div>
  </main>

  <script>
    const avisoOffline = document.getElementById('aviso-offline');

    function actualizarEstadoConexion() {
      avisoOffline.classList.toggle('oculto', navigator.onLine);
    }

    window.addEventListener('online', actualizarEstadoConexion);
    window.addEventListener('offline', actualizarEstadoConexion);
    actualizarEstadoConexion();
  </script>
</body>
</html>

name: Keep-alive Supabase

# Evita que el proyecto gratuito de Supabase se pause por inactividad.
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a la API REST de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        # TODO: cuando existan tablas, cambiar por un select a una tabla real,
        # p. ej. "$SUPABASE_URL/rest/v1/especies?select=id&limit=1".
        run: |
          curl -fsS -o /dev/null "$SUPABASE_URL/rest/v1/" -H "apikey: $SUPABASE_ANON_KEY"
